<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nudge Buddy</title>
  <style>
    :root {
      --bg: #C6C0B9;
      --card: #FFFFFF;
      --warm: #EFEBE6;
      --rose: #D9BBB0;
      --border: #AD9C8E;
      --brown: #705E46;
      --espresso: #422701;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--espresso);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar-icon {
      font-size: 26px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--rose);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(66, 39, 1, 0.15);
    }
    h1 {
      font-size: 16px;
      font-weight: 800;
      color: var(--espresso);
    }
    .subtitle {
      font-size: 11px;
      font-weight: 600;
      color: var(--brown);
    }
    .streak-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--warm);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
    }
    .status-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(66, 39, 1, 0.05);
    }
    .status-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--brown);
      margin-bottom: 6px;
    }
    .status-desc {
      font-size: 13px;
      line-height: 1.45;
      font-weight: 500;
    }
    .btn-primary {
      width: 100%;
      background: var(--espresso);
      color: var(--bg);
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(66, 39, 1, 0.2);
      transition: all 0.15s ease;
      margin-bottom: 8px;
    }
    .btn-primary:hover {
      background: #331D00;
      transform: translateY(-1px);
    }
    .btn-secondary {
      width: 100%;
      background: var(--rose);
      color: var(--espresso);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover {
      background: #CEAAA0;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--brown);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="avatar-icon" id="popup-avatar">🐰</div>
      <div>
        <h1>Nudge Buddy</h1>
        <div class="subtitle">AI Coding Companion</div>
      </div>
    </div>
    <div class="streak-badge">
      <span>🔥</span>
      <span id="popup-streak">4d</span>
    </div>
  </div>

  <div class="status-card">
    <div class="status-title" id="page-status-label">Active Tab Status</div>
    <div class="status-desc" id="page-status-desc">Detecting coding problem...</div>
  </div>

  <button id="btn-toggle-console" class="btn-primary">
    <span>✨</span>
    <span id="btn-toggle-text">Open Nudge Console</span>
  </button>

  <button id="btn-open-options" class="btn-secondary">
    <span>📅</span>
    <span>Habit Studio & Revision Queue</span>
  </button>

  <button id="btn-open-leetcode" class="btn-secondary">
    <span>🌐</span>
    <span>Go to LeetCode Problems</span>
  </button>

  <div class="footer-note">Shortcut: <b>Alt + H</b> toggles console on problem pages</div>

  <script src="popup.js"></script>
</body>
</html>
